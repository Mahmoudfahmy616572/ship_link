name: Deploy Admin Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/web/admin/**'
      - 'lib/web/main_web.dart'
      - 'lib/web/routs_web.dart'
      - 'lib/web/data/services_locators.dart'
      - 'lib/core/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build admin web
        run: flutter build web --target lib/web/main_web.dart --release --base-href /ship_link/admin/ --no-wasm-dry-run
      - name: Deploy to gh-pages under /ship_link/admin
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          destination_dir: ship_link/admin
