plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def mapsApiKey = localProperties.getProperty('MAPS_API_KEY', '')

android {
    namespace "com.shiplink.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    buildFeatures {
        resValues = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    flavorDimensions "app"

    productFlavors {
        user {
            dimension "app"
            applicationId "com.shiplink.app.user"
            versionNameSuffix "-user"
            resValue "string", "app_name", "ShipLink"
        }
        driver {
            dimension "app"
            applicationId "com.shiplink.app.driver"
            versionNameSuffix "-driver"
            resValue "string", "app_name", "ShipLink Driver"
        }
    }

    defaultConfig {
        applicationId "com.shiplink.app.user"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        missingDimensionStrategy "app", "user"
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "com.google.android.gms:play-services-base:18.5.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
